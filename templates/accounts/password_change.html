{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{% url 'profile' %}">Settings</a></li><li class="breadcrumb-item active">Change password</li></ol></nav>
  <h1 class="h3 mb-3">Change password</h1>
  <div class="card"><div class="card-body p-4">
    <form method="post" novalidate>{% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-dark">Change password</button>
        <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
