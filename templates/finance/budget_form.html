{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Set budget{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3 mb-3">Set budget</h1>
  <div class="alert alert-info">If the department already has a current budget, this saves a new version and keeps the old one in the history.</div>
  <div class="card"><div class="card-body p-4">
    <form method="post" novalidate>{% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-dark">Save budget</button>
        <a href="{% url 'budget_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
