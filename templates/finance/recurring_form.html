{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} recurring expense{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3 mb-3">{% if object %}Edit{% else %}Add{% endif %} recurring expense</h1>
  <div class="card"><div class="card-body p-4">
    <form method="post" novalidate>{% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-dark">{% if object %}Save changes{% else %}Save{% endif %}</button>
        <a href="{% url 'recurring_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
